openapi: 3.0.3
info:
  title: Coolify API - Postman Starter Collection
  version: 1.0.0
  description: OpenAPI preparado para importar en Postman. Basado en el índice público de Coolify API Reference y con esquemas flexibles para
    facilitar pruebas contra distintas versiones de Coolify. Configura la variable de servidor baseUrl, normalmente https://tu-coolify.example.com/api/v1,
    y el token Bearer en Postman.
servers:
- url: '{baseUrl}'
  description: 'Coolify API base URL. Ejemplo: https://coolify.example.com/api/v1'
  variables:
    baseUrl:
      default: https://coolify.example.com/api/v1
      description: URL base de la API de Coolify.
tags:
- name: Default
- name: Applications
- name: Cloud Tokens
- name: Databases
- name: Deployments
- name: GitHub Apps
- name: Hetzner
- name: Projects
- name: Resources
- name: Private Keys
- name: Servers
- name: Services
- name: Teams
paths:
  /version:
    get:
      tags:
      - Default
      summary: Version
      description: Obtiene la versión de Coolify.
      operationId: get_version
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Devuelve la versión de la aplicación.
          content:
            text/html:
              schema:
                type: string
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /enable-api:
    get:
      tags:
      - Default
      summary: Enable API
      description: Activa la API de Coolify.
      operationId: enable_api
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Respuesta correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
